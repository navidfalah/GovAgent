[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "govagents"
version = "0.1.0"
description = "Multi-agent AI governance and policy reasoning system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # LLM
    "litellm>=1.40.0",
    "google-generativeai>=0.7.0",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Vector DB
    "chromadb>=0.5.0",

    # Embeddings
    "sentence-transformers>=3.0.0",

    # NLP utilities
    "rank-bm25>=0.2.2",

    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Logging
    "structlog>=24.1.0",
    "rich>=13.7.0",

    # Async
    "anyio>=4.4.0",
    "httpx>=0.27.0",

    # Knowledge graph
    "networkx>=3.3",

    # Utilities
    "tenacity>=8.3.0",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["govagents*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
govagents-ingest = "govagents.scripts.ingest_policies:main"
govagents-demo = "govagents.scripts.run_demo:main"
